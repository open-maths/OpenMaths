name: dashboard

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Regenerate STATUS.md dashboards and graph.json
        run: python scripts/build_graph.py

      - name: Commit if changed
        run: |
          git config user.name "openmaths-bot"
          git config user.email "actions@users.noreply.github.com"
          git add graph.json problems/*/STATUS.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: regenerate dashboards [skip ci]"
            git push
          fi
